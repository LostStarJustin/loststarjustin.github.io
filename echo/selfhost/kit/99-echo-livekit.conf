# Echo / LiveKit 宿主机内核参数（ECHO 2026-10-17，广州测试服实测 rmem_max 默认 212992 远低于 LiveKit 建议）。
# 作用：LiveKit SFU 的媒体走 UDP（7882/udp），内核 socket 接收 / 发送缓冲太小时，流量抖动或进程稍慢即在内核层丢包，
# 表现为卡顿 / 丢包率升高；LiveKit 启动日志会提示「UDP buffer size too small」并建议 5000000。
# 这是**宿主机**参数，容器内改不了（net.core.* 不随网络命名空间），所以不能写进 docker-compose，必须装到宿主 /etc/sysctl.d/。
# 安装：sudo install -m 644 deploy/host/99-echo-livekit.conf /etc/sysctl.d/99-echo-livekit.conf && sudo sysctl --system
# 生效：LiveKit 在建 socket 时申请缓冲，改完需 `docker compose up -d --force-recreate livekit`（会断一次当前房间）。
# 验证：sysctl net.core.rmem_max net.core.wmem_max 应各为 5000000；docker compose logs livekit 不再出现 buffer 告警。
net.core.rmem_max = 5000000
net.core.wmem_max = 5000000
